context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.name        = "stereo-balanced"
            node.description = "Stereo (separate jacks)"

            capture.props = {
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }

            playback.props = {
                audio.position   = [ FL FR RL RR ]
            }

            filter.graph = {
                nodes = [
                    {
                        name  = left
                        type  = builtin
                        label = copy
                    }
                    {
                        name  = left1
                        type  = builtin
                        label = copy
                    }
                    {
                        name  = left2
                        type  = builtin
                        label = invert
                    }
                    {
                        name  = right
                        type  = builtin
                        label = copy
                    }
                    {
                        name  = right1
                        type  = builtin
                        label = copy
                    }
                    {
                        name  = right2
                        type  = builtin
                        label = invert
                    }
                ]
                inputs  = [ "left:In" "right:In" ]
                links = [
                    { output = "left:Out" input = "left1:In" }
                    { output = "left:Out" input = "left2:In" }
                    { output = "right:Out" input = "right1:In" }
                    { output = "right:Out" input = "right2:In" }
                ]
                outputs = [ "left1:Out" "left2:Out" "right1:Out" "right2:Out" ]
            }
        }
    }
]
